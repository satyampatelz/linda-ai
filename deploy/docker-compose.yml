# Satyam cloud stack — backend + Caddy reverse proxy (automatic HTTPS).
#
# Run from this folder:  docker compose up -d --build
# (deploy.sh does all of this for you — see ORACLE_GUIDE.md.)
#
# Settings live in deploy/.env (copy from .env.example). The two values
# you MUST set: DOMAIN and GEMINI_API_KEY. API_TOKEN is generated by
# deploy.sh if left empty.
services:
  satyam:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: satyam
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      # The cloud VM has no screen — the browser runs headless.
      - BROWSER_HEADLESS=true
    volumes:
      # Memory + task history and agent files survive restarts/rebuilds.
      - satyam_data:/app/data
      - satyam_workspace:/app/workspace
    networks:
      - satyam_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: satyam_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN=${DOMAIN:-}
    depends_on:
      satyam:
        condition: service_healthy
    networks:
      - satyam_net

volumes:
  satyam_data:
  satyam_workspace:
  caddy_data:
  caddy_config:

networks:
  satyam_net:
